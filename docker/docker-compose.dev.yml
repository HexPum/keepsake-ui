services:
  web:
    build:
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
      - pnpm-store:/pnpm
      # Where the sqlite db and assets live. Defaults to the docker volume
      # named "data"; set DATA_PATH in docker/.env to an absolute host path to
      # use a real directory instead. Compose treats a source starting with /
      # or . as a bind mount and anything else as a named volume.
      #
      # Worth being deliberate about: the volume and a host directory are two
      # different databases. Pointing at the empty one makes a real account
      # look like a wrong password.
      - ${DATA_PATH:-data}:${DATA_DIR:-/data}
    ports:
      - 3000:3000
    environment:
      # Override any of these via .env if you need custom paths or secrets

      MEILI_ADDR: ${MEILI_ADDR:-http://meilisearch:7700}
      BROWSER_WEB_URL: ${BROWSER_WEB_URL:-http://chrome:9222}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-super-secure-nextauth-secret}
      # You almost never want to change the value of the DATA_DIR variable.
      # If you want to mount a custom directory, change the volume mapping above instead.
      DATA_DIR: ${DATA_DIR:-/data}
      # OPENAI_API_KEY: ...

      HOSTNAME: 0.0.0.0
      # https://github.com/vercel/next.js/issues/71622
      # https://github.com/vercel/next.js/issues/36774
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      # Reaching the dev server over the LAN (a phone, a tethered device) means
      # the browser's origin is a raw IP, which Next's dev server blocks by
      # default — the page still renders but never hydrates. Set both this and
      # NEXTAUTH_URL to that IP in docker/.env when serving over the LAN.
      ALLOWED_DEV_ORIGINS: ${ALLOWED_DEV_ORIGINS:-}
    command:
      - pnpm
      - web
    working_dir: /app
    depends_on:
      prep:
        condition: service_completed_successfully
      meilisearch:
        condition: service_started
      chrome:
        condition: service_started
  mobile:
    build:
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
      - pnpm-store:/pnpm
      - ${DATA_PATH:-data}:${DATA_DIR:-/data}
    ports:
      - 8081:8081
      - 19000:19000
    environment:
      DATA_DIR: ${DATA_DIR:-/data}
      MEILI_ADDR: ${MEILI_ADDR:-http://meilisearch:7700}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-super-secure-nextauth-secret}
      HOSTNAME: 0.0.0.0
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      EXPO_DEBUGGER_MIDDLEWARE_URL: http://0.0.0.0:8081
    command:
      - sh
      - -c
      - cd /app/apps/mobile && pnpm run web
    working_dir: /app
    depends_on:
      prep:
        condition: service_completed_successfully
      meilisearch:
        condition: service_started
      chrome:
        condition: service_started
  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    restart: unless-stopped
    init: true
    ports:
      - 127.0.0.1:9222:9222
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
    volumes:
      - meilisearch:/meili_data
  workers:
    build:
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
      - pnpm-store:/pnpm
      - ${DATA_PATH:-data}:${DATA_DIR:-/data}
      # Instagram serves nothing to a logged-out client, so yt-dlp needs a
      # session. --cookies-from-browser is not an option in here: Chrome's
      # profile lives on the host and its cookies are sealed by the macOS
      # Keychain, neither of which a Linux container can reach. Export the
      # jar on the host instead (docker/export-ig-cookies.py) and mount it.
      #
      # Deliberately NOT :ro. yt-dlp writes the jar back after every run, and
      # a read-only mount turns that into an OSError that exits non-zero — the
      # fetch succeeds and the worker still records a failure. The write is
      # also what lets Instagram's rotated cookies persist, so the session
      # outlives the export.
      - ./ig-cookies.txt:/secrets/ig-cookies.txt
    working_dir: /app
    environment:
      DATA_DIR: ${DATA_DIR:-/data}
      MEILI_ADDR: ${MEILI_ADDR:-http://meilisearch:7700}
      BROWSER_WEB_URL: ${BROWSER_WEB_URL:-http://chrome:9222}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-super-secure-nextauth-secret}
      CRAWLER_YTDLP_COOKIES_FILE: ${CRAWLER_YTDLP_COOKIES_FILE:-/secrets/ig-cookies.txt}
      # 3,520 saved reels would be tens of gigabytes. Transcripts are fetched
      # independently of this and are what the summaries actually read.
      CRAWLER_VIDEO_DOWNLOAD: ${CRAWLER_VIDEO_DOWNLOAD:-false}
      # OPENAI_API_KEY: ...
    command:
      - pnpm
      - workers
    depends_on:
      prep:
        condition: service_completed_successfully
      meilisearch:
        condition: service_started
      chrome:
        condition: service_started
  prep:
    build:
      dockerfile: Dockerfile.dev
    restart: "no"
    working_dir: /app
    environment:
      DATA_DIR: ${DATA_DIR:-/data}
      MEILI_ADDR: ${MEILI_ADDR:-http://meilisearch:7700}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-super-secure-nextauth-secret}
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
      - pnpm-store:/pnpm
      - ${DATA_PATH:-data}:${DATA_DIR:-/data}
    command:
      - /bin/sh
      - -c
      - mkdir -p "${DATA_DIR:-/data}" && pnpm install --frozen-lockfile && (cd packages/db && pnpm exec drizzle-kit migrate || true)

volumes:
  meilisearch:
  data:
  node_modules:
  pnpm-store:
