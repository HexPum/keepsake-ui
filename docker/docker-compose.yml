services:
  web:
    # This fork publishes :release only when a GitHub release is created, and
    # none exists yet — :latest (built on every push to main) is the tag that
    # actually resolves. Pin KEEPSAKE_VERSION to a version tag once you cut a
    # release, so a Pi doesn't silently follow main.
    image: ghcr.io/hexpum/keepsake-ui:${KEEPSAKE_VERSION:-latest}
    restart: unless-stopped
    volumes:
      # By default, the data is stored in a docker volume called "data".
      # If you want to mount a custom directory, change the volume mapping to:
      # - /path/to/your/directory:/data
      - data:/data
    ports:
      - 3000:3000
    env_file:
      - .env
    environment:
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      # OPENAI_API_KEY: ...

      # You almost never want to change the value of the DATA_DIR variable.
      # If you want to mount a custom directory, change the volume mapping above instead.
      DATA_DIR: /data # DON'T CHANGE THIS
    # Ordering matters on an unattended host: after a power cut the Pi brings
    # every container up at once, and the crawler's first jobs fail if Chrome
    # and Meilisearch aren't listening yet.
    depends_on:
      - meilisearch
      - chrome
  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    restart: unless-stopped
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch:/meili_data

volumes:
  meilisearch:
  data:
